[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transfer-learning-colorization"
version = "0.1.0"
description = "Colorize images using a VGG16 feature extractor and a trained decoder"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<2.0",
    "scikit-image>=0.22,<0.26",
    "tensorflow>=2.16,<2.20",
]

[project.scripts]
colorize = "transfer_learning.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transfer_learning"]
